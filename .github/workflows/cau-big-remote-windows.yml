name: Build CAU-BIG Remote Windows

on:
  push:
    branches: ["cau-big-remote-build"]
    paths:
      - "cau-big-remote/windows/**"
      - ".github/workflows/cau-big-remote-windows.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Build Companion
        shell: pwsh
        run: |
          cd cau-big-remote/windows
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o CAU-BIG-Companion.exe main.go
      - name: Package Windows bundle
        shell: pwsh
        run: |
          cd cau-big-remote/windows
          Compress-Archive -Path CAU-BIG-Companion.exe,install.bat,02_CAI_TAILSCALE.cmd,03_HIEN_THONG_TIN_MANG.cmd -DestinationPath CAU-BIG-Windows-Internet.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CAU-BIG-Windows-Internet
          path: cau-big-remote/windows/CAU-BIG-Windows-Internet.zip
          if-no-files-found: error
